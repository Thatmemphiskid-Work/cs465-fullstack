<div class="row justify-content-center">
  <div class="col-12 col-md-6">

    <h2 class="mb-4">
      Admin Login
    </h2>

    <form (ngSubmit)="onLoginSubmit()">

      <div
        *ngIf="formError"
        class="alert alert-danger"
        role="alert">
        {{ formError }}
      </div>

      <div class="mb-3">
        <label
          for="email"
          class="form-label">
          Email Address
        </label>

        <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          [(ngModel)]="credentials.email"
          required>
      </div>

      <div class="mb-3">
        <label
          for="password"
          class="form-label">
          Password
        </label>

        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          [(ngModel)]="credentials.password"
          required>
      </div>

      <button
        type="submit"
        class="btn btn-primary">
        Sign In
      </button>

    </form>
  </div>
</div>
