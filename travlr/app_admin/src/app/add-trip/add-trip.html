<div class="row justify-content-center">
  <div class="col-md-6">

    <h2 class="text-center mb-4">Add Trip</h2>

    <p *ngIf="message" role="alert">{{ message }}</p>

    <form
      *ngIf="addForm"
      [formGroup]="addForm"
      (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label">Code:</label>
        <input
          type="text"
          formControlName="code"
          placeholder="Code"
          class="form-control"
          [ngClass]="{
            'is-invalid': submitted && f['code'].errors
          }">

        <div
          class="invalid-feedback"
          *ngIf="submitted && f['code'].errors?.['required']">
          Trip Code is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Name:</label>
        <input
          type="text"
          formControlName="name"
          placeholder="Name"
          class="form-control"
          [ngClass]="{
            'is-invalid': submitted && f['name'].errors
          }">

        <div
          class="invalid-feedback"
          *ngIf="submitted && f['name'].errors?.['required']">
          Name is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Length:</label>
        <input
          type="text"
          formControlName="length"
          placeholder="4 nights / 5 days"
          class="form-control"
          [ngClass]="{
            'is-invalid': submitted && f['length'].errors
          }">

        <div
          class="invalid-feedback"
          *ngIf="submitted && f['length'].errors?.['required']">
          Length is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Start:</label>
        <input
          type="date"
          formControlName="start"
          class="form-control"
          [ngClass]="{
            'is-invalid': submitted && f['start'].errors
          }">

        <div
          class="invalid-feedback"
          *ngIf="submitted && f['start'].errors?.['required']">
          Date is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Resort:</label>
        <input
          type="text"
          formControlName="resort"
          placeholder="Resort"
          class="form-control"
          [ngClass]="{
            'is-invalid': submitted && f['resort'].errors
          }">

        <div
          class="invalid-feedback"
          *ngIf="submitted && f['resort'].errors?.['required']">
          Resort is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Per Person:</label>
        <input
          type="text"
          formControlName="perPerson"
          placeholder="799.00"
          class="form-control"
          [ngClass]="{
            'is-invalid': submitted && f['perPerson'].errors
          }">

        <div
          class="invalid-feedback"
          *ngIf="submitted && f['perPerson'].errors?.['required']">
          Per Person is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Image Name:</label>
        <input
          type="text"
          formControlName="image"
          placeholder="reef1.jpg"
          class="form-control"
          [ngClass]="{
            'is-invalid': submitted && f['image'].errors
          }">

        <div
          class="invalid-feedback"
          *ngIf="submitted && f['image'].errors?.['required']">
          Image Name is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Description:</label>
        <input
          type="text"
          formControlName="description"
          placeholder="Description"
          class="form-control"
          [ngClass]="{
            'is-invalid': submitted && f['description'].errors
          }">

        <div
          class="invalid-feedback"
          *ngIf="submitted && f['description'].errors?.['required']">
          Description is required
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary">
        Save
      </button>

      <button
        type="button"
        class="btn btn-secondary ms-2"
        (click)="router.navigate([''])">
        Cancel
      </button>

    </form>
  </div>
</div>
